<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Sky with subtle dawn/dusk atmospheric haze -->
    <linearGradient id="skyHaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142D45" />
      <stop offset="30%" stop-color="#224263" />
      <stop offset="65%" stop-color="#8E9DAE" />
      <stop offset="85%" stop-color="#D5C5B2" />
      <stop offset="100%" stop-color="#EAE6DF" />
    </linearGradient>

    <!-- Warm rising sun flare glow -->
    <radialGradient id="sunGlow" cx="72%" cy="62%" r="45%">
      <stop offset="0%" stop-color="#FFF7ED" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#FDE68A" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#B18A58" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#142D45" stop-opacity="0" />
    </radialGradient>

    <!-- Precast Concrete Pier Gradients -->
    <linearGradient id="concretePillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAE6DF" />
      <stop offset="35%" stop-color="#C5C2BA" />
      <stop offset="70%" stop-color="#9A9790" />
      <stop offset="100%" stop-color="#6E6C66" />
    </linearGradient>

    <linearGradient id="concreteDeck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9D5CC" />
      <stop offset="40%" stop-color="#B8B4AB" />
      <stop offset="100%" stop-color="#5C5B57" />
    </linearGradient>

    <!-- Deep Water / River Reflection -->
    <linearGradient id="waterSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556B82" />
      <stop offset="30%" stop-color="#314B66" />
      <stop offset="70%" stop-color="#1C334A" />
      <stop offset="100%" stop-color="#102336" />
    </linearGradient>

    <!-- Asphalt Road Grade -->
    <linearGradient id="asphaltRoad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B424B" />
      <stop offset="100%" stop-color="#20272D" />
    </linearGradient>

    <!-- Subtle Architectural Grid Overlay -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Sky & Atmosphere -->
  <rect width="1600" height="1000" fill="url(#skyHaze)" />
  <rect width="1600" height="1000" fill="url(#sunGlow)" />
  <rect width="1600" height="1000" fill="url(#archGrid)" />

  <!-- Distant Mountain / Foothills Silhouette -->
  <path d="M 0 650 Q 240 580 480 620 T 960 590 T 1380 610 Q 1500 580 1600 620 L 1600 750 L 0 750 Z" fill="#6A7A8C" opacity="0.4" />
  <path d="M 0 670 Q 320 620 640 650 T 1280 630 Q 1460 610 1600 640 L 1600 780 L 0 780 Z" fill="#43566B" opacity="0.55" />

  <!-- River Basin / Deep Water Base -->
  <rect y="740" width="1600" height="260" fill="url(#waterSurface)" />

  <!-- Soft Water Reflections of Superstructure -->
  <g opacity="0.25" filter="blur(8px)">
    <rect x="220" y="740" width="120" height="180" fill="#EAE6DF" />
    <rect x="620" y="740" width="140" height="220" fill="#EAE6DF" />
    <rect x="1080" y="740" width="130" height="200" fill="#EAE6DF" />
    <polygon points="0,740 1600,740 1600,820 0,800" fill="#D9D5CC" />
  </g>

  <!-- Water Surface Wave Riples -->
  <g stroke="#9BB0C7" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <line x1="80" y1="765" x2="220" y2="765" />
    <line x1="380" y1="785" x2="540" y2="785" />
    <line x1="180" y1="810" x2="360" y2="810" />
    <line x1="720" y1="775" x2="890" y2="775" />
    <line x1="940" y1="830" x2="1140" y2="830" />
    <line x1="1240" y1="790" x2="1420" y2="790" />
    <line x1="560" y1="860" x2="840" y2="860" stroke-width="2" />
  </g>

  <!-- Massive Prestressed Concrete Viaduct Piers (Perspective: Left to Right Curve) -->
  <!-- Pier 1 (Far Distance Left) -->
  <g>
    <polygon points="40,560 85,560 95,750 30,750" fill="url(#concretePillar)" opacity="0.75" />
    <polygon points="25,550 100,550 85,565 40,565" fill="#C5C2BA" opacity="0.75" />
  </g>

  <!-- Pier 2 (Mid Distance Left) -->
  <g>
    <polygon points="230,460 310,460 325,760 215,760" fill="url(#concretePillar)" />
    <!-- Pier Cap -->
    <polygon points="205,445 335,445 315,465 225,465" fill="#EAE6DF" />
    <!-- Fluting detail grooves -->
    <line x1="260" y1="465" x2="260" y2="760" stroke="#8E8B84" stroke-width="2" />
    <line x1="280" y1="465" x2="280" y2="760" stroke="#5C5B57" stroke-width="2" />
  </g>

  <!-- Pier 3 (Main Structural Focal Pier - Center Right) -->
  <g>
    <polygon points="620,340 740,340 765,770 595,770" fill="url(#concretePillar)" />
    <!-- Massive Flared Pier Hammerhead Cap -->
    <polygon points="570,320 790,320 745,350 615,350" fill="#FAF9F6" />
    <polygon points="570,320 790,320 780,328 580,328" fill="#FFFFFF" />
    <line x1="660" y1="350" x2="660" y2="770" stroke="#A8A59E" stroke-width="3" />
    <line x1="680" y1="350" x2="680" y2="770" stroke="#77756F" stroke-width="3" />
    <line x1="700" y1="350" x2="700" y2="770" stroke="#4F4E49" stroke-width="3" />
    <!-- Heavy Deep Foundation Pile Cap Block -->
    <polygon points="575,750 785,750 780,780 580,780" fill="#3D4043" />
  </g>

  <!-- Pier 4 (Foreground Right) -->
  <g>
    <polygon points="1100,280 1260,280 1295,780 1065,780" fill="url(#concretePillar)" />
    <!-- Hammerhead Pier Cap -->
    <polygon points="1030,250 1330,250 1270,290 1090,290" fill="#FAF9F6" />
    <line x1="1160" y1="290" x2="1160" y2="780" stroke="#A8A59E" stroke-width="4" />
    <line x1="1190" y1="290" x2="1190" y2="780" stroke="#77756F" stroke-width="4" />
    <line x1="1220" y1="290" x2="1220" y2="780" stroke="#4F4E49" stroke-width="4" />
  </g>

  <!-- Continuous Curved Box-Girder Viaduct Superstructure Deck -->
  <g>
    <!-- Deck Soffit (Underneath Shadow) -->
    <polygon points="0,520 1600,230 1600,270 0,560" fill="#20272D" />
    <!-- Main Box Girder Web Profile -->
    <polygon points="0,480 1600,190 1600,240 0,530" fill="url(#concreteDeck)" />
    <!-- Top Cantilever Slab & Parapet Edge Barrier -->
    <polygon points="0,460 1600,170 1600,200 0,490" fill="#FAF9F6" />
    <!-- Steel Crash Barrier / Railing Line -->
    <line x1="0" y1="455" x2="1600" y2="165" stroke="#B18A58" stroke-width="5" />
    <line x1="0" y1="450" x2="1600" y2="160" stroke="#142D45" stroke-width="3" />

    <!-- Deck Expansion Joints / Segment Lines -->
    <g stroke="#20272D" stroke-width="2.5" opacity="0.7">
      <line x1="280" y1="460" x2="280" y2="525" />
      <line x1="450" y1="420" x2="450" y2="480" />
      <line x1="680" y1="330" x2="680" y2="390" />
      <line x1="900" y1="280" x2="900" y2="340" />
      <line x1="1180" y1="220" x2="1180" y2="280" />
      <line x1="1400" y1="180" x2="1400" y2="240" />
    </g>
  </g>

  <!-- Heavy Construction Tower Crane & Precast Gantry (Active Construction Execution) -->
  <g transform="translate(850, 40)">
    <!-- Vertical Lattice Tower Mast -->
    <rect x="140" y="80" width="22" height="420" fill="none" stroke="#B18A58" stroke-width="3" />
    <!-- Lattice X-Bracing -->
    <path d="
      M 140 80 L 162 105 M 162 80 L 140 105
      M 140 105 L 162 130 M 162 105 L 140 130
      M 140 130 L 162 155 M 162 130 L 140 155
      M 140 155 L 162 180 M 162 155 L 140 180
      M 140 180 L 162 205 M 162 180 L 140 205
      M 140 205 L 162 230 M 162 205 L 140 230
      M 140 230 L 162 255 M 162 230 L 140 255
      M 140 255 L 162 280 M 162 255 L 140 280
      M 140 280 L 162 305 M 162 280 L 140 305
      M 140 305 L 162 330 M 162 305 L 140 330
      M 140 330 L 162 355 M 162 330 L 140 355
      M 140 355 L 162 380 M 162 355 L 140 380
    " stroke="#B18A58" stroke-width="2" />

    <!-- Crane Cabin & Slewing Turntable -->
    <rect x="135" y="60" width="32" height="20" fill="#142D45" stroke="#B18A58" stroke-width="2" />
    <polygon points="151,10 135,60 167,60" fill="#142D45" stroke="#B18A58" stroke-width="2" />

    <!-- Horizontal Jib Boom Reaching Left & Right -->
    <line x1="151" y1="60" x2="-120" y2="60" stroke="#142D45" stroke-width="4.5" />
    <line x1="151" y1="60" x2="480" y2="60" stroke="#142D45" stroke-width="4.5" />
    <!-- Stay Cables -->
    <line x1="151" y1="10" x2="-90" y2="60" stroke="#B18A58" stroke-width="2" />
    <line x1="151" y1="10" x2="360" y2="60" stroke="#B18A58" stroke-width="2" />
    <line x1="151" y1="10" x2="450" y2="60" stroke="#B18A58" stroke-width="2" />

    <!-- Hoist Trolley, Cable and Suspended Structural Segment -->
    <rect x="280" y="58" width="24" height="12" fill="#B18A58" />
    <line x1="292" y1="70" x2="292" y2="190" stroke="#20272D" stroke-width="2" stroke-dasharray="6 3" />
    <!-- Concrete Segment in Suspension -->
    <polygon points="250,190 334,190 326,220 258,220" fill="#FAF9F6" stroke="#20272D" stroke-width="2" />
    <line x1="250" y1="190" x2="292" y2="175" stroke="#B18A58" stroke-width="2" />
    <line x1="334" y1="190" x2="292" y2="175" stroke="#B18A58" stroke-width="2" />
  </g>
</svg>

