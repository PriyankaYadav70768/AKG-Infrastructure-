<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKG Infrastructure — Engineering, Construction & Development</title>
    <meta name="description" content="AKG Infrastructure delivers disciplined engineering, construction and development solutions with an emphasis on quality, accountability, and long-term value." />
    <!-- Google Fonts: Editorial Cormorant Garamond + Clean Manrope & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('akg-theme-mode');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            // Default is strictly Light Mode
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAF9F6] text-[#1F242A] antialiased selection:bg-[#1E3A5F] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
